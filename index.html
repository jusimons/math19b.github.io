<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weekly Block Schedule</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    #wrap { padding: 12px; }
    #status { font-size: 12px; opacity: 0.75; margin: 6px 0 10px; }
    #calendar { max-width: 1200px; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="status">Loading…</div>
    <div id="calendar"></div>
  </div>

<script>
/** =========================
 * CONFIG
 * ========================= */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQMfXXgtx0YwUqkmvNPdQgzyiilhkiLMW9KZ2NrWsMx_tuj9GqfGLHHHQNuIFKaSCuQ1MxKwpYyAPlQ/pub?gid=0&single=true&output=csv";

// Explicit header mapping (exactly as you provided)
const COL = {
  day: "Day",
  start: "Start",
  end: "End",
  purpose: "Purpose",
  location: "Location",
  timeslot: "Timeslot"
};

const WEEK_START = 0; // Sunday
const SLOT_MIN_TIME = "07:00:00";
const SLOT_MAX_TIME = "20:00:00";

const REFRESH_EVERY_MINUTES = 15;
const DAILY_REFRESH_HOUR = 8;
const DAILY_REFRESH_MINUTE = 0;

/** =========================
 * Helpers
 * ========================= */
let calendar;

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

function cacheBustedUrl(url) {
  const u = new URL(url);
  u.searchParams.set("_cb", Date.now().toString());
  return u.toString();
}

function norm(v) {
  return (v ?? "").toString().trim();
}

function detectDelimiter(text) {
  // Look at the first non-empty line
  const firstLine = text.split(/\r?\n/).find(l => l.trim().length > 0) || "";
  const tabs = (firstLine.match(/\t/g) || []).length;
  const commas = (firstLine.match(/,/g) || []).length;
  return tabs > commas ? "\t" : ",";
}

function dayToDow(dayStr) {
  const d = norm(dayStr).toLowerCase().replace(/\./g, "");
  const map = {
    sun: 0, sunday: 0, su: 0,
    mon: 1, monday: 1, mo: 1, m: 1,
    tue: 2, tues: 2, tuesday: 2, tu: 2, t: 2,
    wed: 3, weds: 3, wednesday: 3, we: 3, w: 3,
    thu: 4, thur: 4, thurs: 4, thursday: 4, th: 4, r: 4,
    fri: 5, friday: 5, fr: 5, f: 5,
    sat: 6, saturday: 6, sa: 6
  };
  return map[d] ?? null;
}

function parseTimeslot(timeslotStr) {
  // Accepts: "8:00-9:15", "8:00 AM - 9:15 AM", "08:00–09:15", etc.
  const s = norm(timeslotStr).replace(/[–—]/g, "-");
  if (!s) return { startTime: null, endTime: null };

  const parts = s.split("-").map(x => x.trim()).filter(Boolean);
  if (parts.length < 2) return { startTime: null, endTime: null };

  // Reuse your existing toTimeHHMM() for each side
  const startTime = toTimeHHMM(parts[0]);
  const endTime = toTimeHHMM(parts[1]);
  return { startTime, endTime };
}

function rowToRecurringEvent(row) {
  const dow = dayToDow(row[COL.day]);

  // Prefer explicit Start/End
  let startTime = toTimeHHMM(row[COL.start]);
  let endTime = toTimeHHMM(row[COL.end]);

  // Fallback: parse Timeslot if Start/End missing
  if ((!startTime || !endTime) && COL.timeslot) {
    const t = parseTimeslot(row[COL.timeslot]);
    startTime = startTime || t.startTime;
    endTime = endTime || t.endTime;
  }

  const purpose = norm(row[COL.purpose]);
  const location = norm(row[COL.location]);

  if (dow === null || !startTime || !endTime) return null;

  return {
    title: purpose ? (location ? `${purpose} (${location})` : purpose) : (location ? `Block (${location})` : "Block"),
    daysOfWeek: [dow],
    startTime,
    endTime,
    extendedProps: { location, purpose, timeslot: norm(row[COL.timeslot]) }
  };
}

function timeSerialToHHMM(serial) {
  // Google Sheets may export a time as a fraction of a day: 0.5 = 12:00
  const x = Number(serial);
  if (!Number.isFinite(x)) return null;

  // If x is a pure time fraction
  if (x >= 0 && x < 1) {
    const totalMinutes = Math.round(x * 24 * 60);
    const hh = String(Math.floor(totalMinutes / 60) % 24).padStart(2, "0");
    const mm = String(totalMinutes % 60).padStart(2, "0");
    return `${hh}:${mm}`;
  }

  // If it looks like a Sheets date-time serial (days since 1899-12-30)
  // Keep only fractional part for time-of-day
  if (x >= 1) {
    const frac = x - Math.floor(x);
    const totalMinutes = Math.round(frac * 24 * 60);
    const hh = String(Math.floor(totalMinutes / 60) % 24).padStart(2, "0");
    const mm = String(totalMinutes % 60).padStart(2, "0");
    return `${hh}:${mm}`;
  }

  return null;
}

function toTimeHHMM(value) {
  const s = norm(value);
  if (!s) return null;

  // If it’s numeric-ish, try time serial conversion
  if (/^-?\d+(\.\d+)?$/.test(s)) {
    const hhmm = timeSerialToHHMM(s);
    if (hhmm) return hhmm;
  }

  // 24-hour "H:MM" or "HH:MM" (optional :SS)
  if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(s)) {
    const parts = s.split(":");
    const hh = String(parts[0]).padStart(2, "0");
    const mm = parts[1];
    return `${hh}:${mm}`; // FullCalendar accepts HH:MM
  }

  // AM/PM parsing
  if (/[ap]m/i.test(s)) {
    const dt = new Date(`2000-01-01 ${s}`);
    if (!isNaN(dt.getTime())) {
      const hh = String(dt.getHours()).padStart(2, "0");
      const mm = String(dt.getMinutes()).padStart(2, "0");
      return `${hh}:${mm}`;
    }
  }

  return null;
}

function rowToRecurringEvent(row) {
  const dow = dayToDow(row[COL.day]);
  const startTime = toTimeHHMM(row[COL.start]);
  const endTime = toTimeHHMM(row[COL.end]);

  const purpose = norm(row[COL.purpose]);
  const location = norm(row[COL.location]);
  const timeslot = norm(row[COL.timeslot]);

  const titleParts = [];
  if (purpose) titleParts.push(purpose);
  else titleParts.push("Block");

  // Optional: include location in the title line
  if (location) titleParts.push(`(${location})`);

  if (dow === null || !startTime || !endTime) return null;

  return {
    title: titleParts.join(" "),
    daysOfWeek: [dow],
    startTime,
    endTime,
    extendedProps: { location, timeslot, purpose }
  };
}

async function fetchRecurringEvents() {
  setStatus("Fetching schedule…");

  const resp = await fetch(cacheBustedUrl(CSV_URL), { cache: "no-store" });
  if (!resp.ok) throw new Error(`Fetch failed: ${resp.status} ${resp.statusText}`);
  const text = await resp.text();

  const delimiter = detectDelimiter(text);
  const parsed = Papa.parse(text, {
    header: true,
    skipEmptyLines: true,
    delimiter
  });

  const rows = parsed.data || [];
  const headers = parsed.meta?.fields || [];

  // Hard fail early if the delimiter/header parse is wrong
  for (const k of [COL.day, COL.start, COL.end]) {
    if (!headers.includes(k)) {
      console.warn("Parsed headers:", headers);
      throw new Error(
        `Could not find required column "${k}". Parsed headers: ${headers.join(" | ")}`
      );
    }
  }

  const events = rows.map(rowToRecurringEvent).filter(Boolean);
  setStatus(`Loaded ${events.length} blocks. Last updated: ${new Date().toLocaleString()}`);
  return events;
}

async function refreshCalendar() {
  try {
    const events = await fetchRecurringEvents();
    calendar.removeAllEvents();
    calendar.addEventSource(events);
  } catch (e) {
    console.error(e);
    setStatus(`Error: ${e.message}`);
  }
}

function scheduleDailyRefreshAt(hour, minute) {
  function msUntilNext() {
    const now = new Date();
    const next = new Date(now);
    next.setHours(hour, minute, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1);
    return next - now;
  }
  setTimeout(async function run() {
    await refreshCalendar();
    setTimeout(run, 24 * 60 * 60 * 1000);
  }, msUntilNext());
}

document.addEventListener("DOMContentLoaded", async () => {
  calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    initialView: "timeGridWeek",
    firstDay: WEEK_START,
    height: "auto",
    expandRows: true,
    allDaySlot: false,
    slotMinTime: SLOT_MIN_TIME,
    slotMaxTime: SLOT_MAX_TIME,

    // One-page weekly view; no dates/navigation chrome
    headerToolbar: { left: "", center: "", right: "" },
    dayHeaderFormat: { weekday: "long" },

    nowIndicator: false,

    eventDidMount: (info) => {
      const loc = info.event.extendedProps?.location;
      const ts = info.event.extendedProps?.timeslot;
      const p = info.event.extendedProps?.purpose;
      const tooltip = [p, ts, loc].filter(Boolean).join(" — ");
      if (tooltip) info.el.title = tooltip;
    }
  });

  calendar.render();
  await refreshCalendar();

  if (REFRESH_EVERY_MINUTES > 0) {
    setInterval(refreshCalendar, REFRESH_EVERY_MINUTES * 60 * 1000);
  }
  scheduleDailyRefreshAt(DAILY_REFRESH_HOUR, DAILY_REFRESH_MINUTE);
});
</script>
</body>
</html>
