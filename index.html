<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weekly Block Schedule</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    #wrap { padding: 12px; }
    #status { font-size: 12px; opacity: 0.8; margin: 6px 0 10px; white-space: pre-wrap; }
    #calendar { max-width: 1200px; margin: 0 auto; }
    .fc .fc-col-header-cell-cushion { padding: 6px 4px; }
  </style>
</head>

<body>
  <div id="wrap">
    <div id="status">Loading…</div>
    <div id="calendar"></div>
  </div>

<script>
/** =========================
 * CONFIG
 * ========================= */
const CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQMfXXgtx0YwUqkmvNPdQgzyiilhkiLMW9KZ2NrWsMx_tuj9GqfGLHHHQNuIFKaSCuQ1MxKwpYyAPlQ/pub?gid=0&single=true&output=csv";

/**
 * If direct fetch is blocked by CORS, this proxy will usually work.
 * You can replace this later with your own Apps Script proxy for more control.
 */
function proxied(url) {
  return "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
}

// Your exact header names
const COL = {
  day: "Day",
  timeslot: "Timeslot",
  location: "Location",
  purpose: "Purpose",
  start: "Start",
  end: "End"
};

// Calendar display defaults
const WEEK_START = 0; // Sunday
const SLOT_MIN_TIME = "07:00:00";
const SLOT_MAX_TIME = "20:00:00";

// Auto-refresh behavior
const REFRESH_EVERY_MINUTES = 15;
const DAILY_REFRESH_HOUR = 8;
const DAILY_REFRESH_MINUTE = 0;

/** =========================
 * IMPLEMENTATION
 * ========================= */
let calendar;

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

function cacheBustedUrl(url) {
  const u = new URL(url);
  u.searchParams.set("_cb", Date.now().toString());
  return u.toString();
}

function norm(v) {
  return (v ?? "").toString().trim();
}

function dayToDow(dayStr) {
  const d = norm(dayStr).toLowerCase().replace(/\./g, "");
  const map = {
    sun: 0, sunday: 0, su: 0,
    mon: 1, monday: 1, mo: 1, m: 1,
    tue: 2, tues: 2, tuesday: 2, tu: 2, t: 2,
    wed: 3, weds: 3, wednesday: 3, we: 3, w: 3,
    thu: 4, thur: 4, thurs: 4, thursday: 4, th: 4, r: 4,
    fri: 5, friday: 5, fr: 5, f: 5,
    sat: 6, saturday: 6, sa: 6
  };
  return map[d] ?? null;
}

function timeSerialToHHMM(serialStr) {
  const x = Number(serialStr);
  if (!Number.isFinite(x)) return null;

  // time fraction (0..1)
  if (x >= 0 && x < 1) {
    const totalMinutes = Math.round(x * 24 * 60);
    const hh = String(Math.floor(totalMinutes / 60) % 24).padStart(2, "0");
    const mm = String(totalMinutes % 60).padStart(2, "0");
    return `${hh}:${mm}`;
  }

  // date-time serial (>=1): keep fractional part
  if (x >= 1) {
    const frac = x - Math.floor(x);
    const totalMinutes = Math.round(frac * 24 * 60);
    const hh = String(Math.floor(totalMinutes / 60) % 24).padStart(2, "0");
    const mm = String(totalMinutes % 60).padStart(2, "0");
    return `${hh}:${mm}`;
  }

  return null;
}

function toTimeHHMM(value) {
  const s = norm(value);
  if (!s) return null;

  // numeric serial
  if (/^-?\d+(\.\d+)?$/.test(s)) {
    const hhmm = timeSerialToHHMM(s);
    if (hhmm) return hhmm;
  }

  // 24-hour "H:MM" / "HH:MM" (ignore seconds if present)
  if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(s)) {
    const [h, m] = s.split(":");
    return `${String(h).padStart(2, "0")}:${m}`;
  }

  // AM/PM
  if (/[ap]m/i.test(s)) {
    const dt = new Date(`2000-01-01 ${s}`);
    if (!isNaN(dt.getTime())) {
      return `${String(dt.getHours()).padStart(2, "0")}:${String(dt.getMinutes()).padStart(2, "0")}`;
    }
  }

  return null;
}

function parseTimeslot(timeslotStr) {
  const s = norm(timeslotStr).replace(/[–—]/g, "-");
  if (!s) return { startTime: null, endTime: null };

  const parts = s.split("-").map(x => x.trim()).filter(Boolean);
  if (parts.length < 2) return { startTime: null, endTime: null };

  return { startTime: toTimeHHMM(parts[0]), endTime: toTimeHHMM(parts[1]) };
}

function rowToRecurringEvent(row) {
  const dow = dayToDow(row[COL.day]);

  let startTime = toTimeHHMM(row[COL.start]);
  let endTime = toTimeHHMM(row[COL.end]);

  if ((!startTime || !endTime) && COL.timeslot) {
    const t = parseTimeslot(row[COL.timeslot]);
    startTime = startTime || t.startTime;
    endTime = endTime || t.endTime;
  }

  const purpose = norm(row[COL.purpose]);
  const location = norm(row[COL.location]);
  const timeslot = norm(row[COL.timeslot]);

  if (dow === null || !startTime || !endTime) return null;

  const title =
    purpose ? (location ? `${purpose} (${location})` : purpose)
            : (location ? `Block (${location})` : "Block");

  return {
    title,
    daysOfWeek: [dow],
    startTime,
    endTime,
    extendedProps: { location, purpose, timeslot }
  };
}

async function fetchTextWithFallback(url) {
  // 1) try direct fetch
  try {
    const r1 = await fetch(cacheBustedUrl(url), { cache: "no-store" });
    if (r1.ok) return await r1.text();
    throw new Error(`Direct fetch failed: ${r1.status} ${r1.statusText}`);
  } catch (e1) {
    // 2) try via proxy
    const r2 = await fetch(cacheBustedUrl(proxied(url)), { cache: "no-store" });
    if (!r2.ok) throw new Error(`Proxy fetch failed: ${r2.status} ${r2.statusText}`);
    return await r2.text();
  }
}

async function fetchRecurringEventsFromCsv() {
  setStatus("Fetching schedule…");

  const csvText = await fetchTextWithFallback(CSV_URL);

  const parsed = Papa.parse(csvText, {
    header: true,
    skipEmptyLines: true,
    delimiter: ",",
    transformHeader: (h) =>
      (h ?? "")
        .toString()
        .replace(/^\uFEFF/, "")
        .replace(/\t/g, "")
        .replace(/\s+/g, " ")
        .trim()
  });

  const rows = parsed.data || [];
  const headers = parsed.meta?.fields || [];

  if (!headers.includes(COL.day)) {
    throw new Error(`CSV parsed, but missing "${COL.day}" header. Parsed headers: ${headers.join(" | ")}`);
  }

  const events = rows.map(rowToRecurringEvent).filter(Boolean);

  // Useful debug info in the status area
  setStatus(
    `Loaded ${events.length} blocks.\n` +
    `Parsed headers: ${headers.join(" | ")}\n` +
    `Last updated: ${new Date().toLocaleString()}`
  );

  return events;
}

async function refreshCalendar() {
  try {
    const events = await fetchRecurringEventsFromCsv();
    calendar.removeAllEvents();
    calendar.addEventSource(events);
  } catch (e) {
    console.error(e);
    setStatus(`Error: ${e.message}`);
  }
}

function scheduleDailyRefreshAt(hour, minute) {
  function msUntilNextTrigger() {
    const now = new Date();
    const next = new Date(now);
    next.setHours(hour, minute, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1);
    return next - now;
  }
  setTimeout(async function run() {
    await refreshCalendar();
    setTimeout(run, 24 * 60 * 60 * 1000);
  }, msUntilNextTrigger());
}

document.addEventListener("DOMContentLoaded", async () => {
  calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    initialView: "timeGridWeek",
    firstDay: WEEK_START,
    height: "auto",
    expandRows: true,
    allDaySlot: false,
    slotMinTime: SLOT_MIN_TIME,
    slotMaxTime: SLOT_MAX_TIME,
    nowIndicator: false,

    // One-page weekly schedule; no navigation; weekday-only headers (no dates)
    headerToolbar: { left: "", center: "", right: "" },
    dayHeaderContent: (arg) =>
      new Intl.DateTimeFormat(undefined, { weekday: "long" }).format(arg.date),

    eventDidMount: (info) => {
      const p = info.event.extendedProps?.purpose;
      const ts = info.event.extendedProps?.timeslot;
      const loc = info.event.extendedProps?.location;
      const tooltip = [p, ts, loc].filter(Boolean).join(" — ");
      if (tooltip) info.el.title = tooltip;
    }
  });

  calendar.render();
  await refreshCalendar();

  if (REFRESH_EVERY_MINUTES > 0) {
    setInterval(refreshCalendar, REFRESH_EVERY_MINUTES * 60 * 1000);
  }
  scheduleDailyRefreshAt(DAILY_REFRESH_HOUR, DAILY_REFRESH_MINUTE);
});
</script>
</body>
</html>
