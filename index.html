<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weekly Block Schedule</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    #wrap { padding: 12px; }
    #status { font-size: 12px; opacity: 0.75; margin: 6px 0 10px; }
    #calendar { max-width: 1200px; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="status">Loading…</div>
    <div id="calendar"></div>
  </div>

<script>
/** =========================
 * CONFIG
 * ========================= */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQMfXXgtx0YwUqkmvNPdQgzyiilhkiLMW9KZ2NrWsMx_tuj9GqfGLHHHQNuIFKaSCuQ1MxKwpYyAPlQ/pub?gid=0&single=true&output=csv";

/** Calendar look/feel */
const SLOT_MIN_TIME = "07:00:00";
const SLOT_MAX_TIME = "20:00:00";
const WEEK_START = 0; // 0 = Sunday
const REFRESH_EVERY_MINUTES = 15;
const DAILY_REFRESH_HOUR = 8;
const DAILY_REFRESH_MINUTE = 0;

/** =========================
 * Helpers
 * ========================= */
let calendar;

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

function cacheBustedUrl(url) {
  const u = new URL(url);
  u.searchParams.set("_cb", Date.now().toString());
  return u.toString();
}

function norm(s) {
  return (s ?? "").toString().trim();
}

function findHeader(headers, candidates) {
  // candidates: array of substrings to match, e.g. ["day", "weekday"]
  const lower = headers.map(h => h.toLowerCase());
  for (const cand of candidates) {
    const idx = lower.findIndex(h => h === cand || h.includes(cand));
    if (idx >= 0) return headers[idx];
  }
  return null;
}

function dayToDow(dayStr) {
  const d = norm(dayStr).toLowerCase();
  // Accept "Sun", "Sunday", etc.
  const map = {
    sun: 0, sunday: 0,
    mon: 1, monday: 1,
    tue: 2, tues: 2, tuesday: 2,
    wed: 3, weds: 3, wednesday: 3,
    thu: 4, thur: 4, thurs: 4, thursday: 4,
    fri: 5, friday: 5,
    sat: 6, saturday: 6
  };
  return map[d] ?? null;
}

function toTimeHHMM(t) {
  // FullCalendar recurring events accept startTime/endTime as "HH:MM" or "HH:MM:SS"
  // We’ll try to preserve 24h times, and also parse basic AM/PM.
  const s = norm(t);
  if (!s) return null;

  // If already looks like 24h "HH:MM" or "H:MM"
  if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(s)) {
    const [hh, mm, ss] = s.split(":");
    const H = String(hh).padStart(2, "0");
    const rest = ss ? `:${ss}` : "";
    return `${H}:${mm}${rest}`;
  }

  // If AM/PM, convert using Date parsing with a fixed date.
  if (/[ap]m/i.test(s)) {
    const dt = new Date(`2000-01-01 ${s}`);
    if (isNaN(dt.getTime())) return null;
    const hh = String(dt.getHours()).padStart(2, "0");
    const mm = String(dt.getMinutes()).padStart(2, "0");
    return `${hh}:${mm}`;
  }

  return null;
}

function rowToRecurringEvent(row, keys) {
  const dow = dayToDow(row[keys.day]);
  const startTime = toTimeHHMM(row[keys.start]);
  const endTime = toTimeHHMM(row[keys.end]);
  const title = norm(row[keys.title]) || "Scheduled Block";

  if (dow === null || !startTime || !endTime) return null;

  const evt = {
    title,
    daysOfWeek: [dow],     // recurring weekly
    startTime,
    endTime
  };

  // Optional coloring if you have a color/category column
  if (keys.color && norm(row[keys.color])) {
    evt.backgroundColor = norm(row[keys.color]);
    evt.borderColor = norm(row[keys.color]);
  }

  return evt;
}

async function fetchRecurringEventsFromCsv() {
  setStatus("Fetching CSV…");
  const resp = await fetch(cacheBustedUrl(CSV_URL), { cache: "no-store" });
  if (!resp.ok) throw new Error(`CSV fetch failed: ${resp.status} ${resp.statusText}`);
  const csvText = await resp.text();

  const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
  const rows = parsed.data || [];
  const headers = parsed.meta?.fields || Object.keys(rows[0] || {});
  if (!headers.length) throw new Error("CSV appears empty or has no header row.");

  // Flexible header detection
  const keys = {
    day: findHeader(headers, ["day", "weekday"]),
    start: findHeader(headers, ["start", "begin"]),
    end: findHeader(headers, ["end", "finish"]),
    title: findHeader(headers, ["title", "event", "name", "block"]),
    color: findHeader(headers, ["color", "colour"])
  };

  if (!keys.day || !keys.start || !keys.end) {
    console.warn("Detected headers:", headers);
    console.warn("Detected key mapping:", keys);
    throw new Error("Could not detect required columns (day/start/end). See console for detected headers.");
  }
  if (!keys.title) keys.title = keys.day; // fallback so something renders

  const events = rows.map(r => rowToRecurringEvent(r, keys)).filter(Boolean);

  setStatus(`Loaded ${events.length} blocks. Last updated: ${new Date().toLocaleString()}`);
  return events;
}

async function refreshCalendar() {
  try {
    const events = await fetchRecurringEventsFromCsv();
    calendar.removeAllEvents();
    calendar.addEventSource(events);
  } catch (e) {
    console.error(e);
    setStatus(`Error: ${e.message}`);
  }
}

function scheduleDailyRefreshAt(hour, minute) {
  function msUntilNext() {
    const now = new Date();
    const next = new Date(now);
    next.setHours(hour, minute, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1);
    return next - now;
  }
  setTimeout(async function run() {
    await refreshCalendar();
    setTimeout(run, 24 * 60 * 60 * 1000);
  }, msUntilNext());
}

document.addEventListener("DOMContentLoaded", async () => {
  calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    initialView: "timeGridWeek",
    firstDay: WEEK_START,
    height: "auto",
    expandRows: true,
    allDaySlot: false,
    slotMinTime: SLOT_MIN_TIME,
    slotMaxTime: SLOT_MAX_TIME,

    // One-page weekly schedule; no navigation; no date numbers
    headerToolbar: { left: "", center: "", right: "" },
    dayHeaderFormat: { weekday: "long" },     // "Sunday", "Monday", …
    titleFormat: { year: undefined, month: undefined, day: undefined },

    // Hide the small “date” numbers that FullCalendar normally shows in week headers
    // (This works by removing the “day number” element after render.)
    viewDidMount: () => {
      document.querySelectorAll(".fc-col-header-cell-cushion").forEach(el => {
        el.style.whiteSpace = "nowrap";
      });
      document.querySelectorAll(".fc-daygrid-day-number, .fc-timegrid-axis-cushion").forEach(el => {});
    },

    nowIndicator: false
  });

  calendar.render();
  await refreshCalendar();

  if (REFRESH_EVERY_MINUTES > 0) {
    setInterval(refreshCalendar, REFRESH_EVERY_MINUTES * 60 * 1000);
  }
  scheduleDailyRefreshAt(DAILY_REFRESH_HOUR, DAILY_REFRESH_MINUTE);
});
</script>
</body>
</html>
