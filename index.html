<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly Availability</title>

  <!-- FullCalendar (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/index.global.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@fullcalendar/timegrid@6.1.15/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/timegrid@6.1.15/index.global.min.js"></script>

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:#111; }
    #wrap { padding: 12px; }
    #calendar { margin-top: 8px; }
    .note { font-size: 14px; line-height: 1.4; margin: 0 0 10px 0; }
    .error {
      border: 1px solid #ddd; background: #fafafa; padding: 10px; border-radius: 8px;
      margin-top: 10px; white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px; color:#222;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <p class="note">Weekly schedule (auto-updates from Google Sheets). Refresh if something looks stale.</p>
    <div id="calendar"></div>
    <div id="errorBox" class="error" style="display:none;"></div>
  </div>

  <script>
    // ======================
    // CONFIG — YOUR SHEET
    // ======================
    const SHEET_ID = "1LkjDR3JC-L5n8zoEQEzJJOoGLvgzfTahEwQcZCbGghc";
    const SHEET_NAME = "Sheet1";
    const RANGE_A1 = `${SHEET_NAME}!A:D`;

    // IMPORTANT: use a rotated + restricted key (Sheets API only; referrer restricted to your GitHub Pages domain)
    const API_KEY = "YOUR_API_KEY_HERE";

    // Exact headers in your sheet:
    const COL_EVENT = "Event Type";
    const COL_DAY = "Day";
    const COL_TIME = "Time";
    const COL_LOCATION = "Location";

    // Sunday-start week
    const DAY_INDEX = { Su: 0, Mo: 1, Tu: 2, We: 3, Th: 4, Fr: 5, Sa: 6 };

    function showError(msg) {
      const box = document.getElementById("errorBox");
      box.style.display = "block";
      box.textContent = msg;
    }

    function startOfWeekSunday(d) {
      const date = new Date(d);
      date.setHours(0, 0, 0, 0);
      const diff = date.getDay(); // 0=Sun
      date.setDate(date.getDate() - diff);
      return date;
    }

    function normalizeDay(rawDay, eventTypeMaybe) {
      let d = String(rawDay || "").trim();

      // Recover day code if it was accidentally appended to the event type, e.g. "Office Hours (Simons)Fr"
      if ((!d || d.length < 2) && eventTypeMaybe) {
        const m = String(eventTypeMaybe).match(/\b(Su|Mo|Tu|We|Th|Fr|Sa|Ft|Thu|Tue)\b/);
        if (m) d = m[1];
      }

      // Normalize common variants/typos
      if (d === "Ft") d = "Fr";   // observed in your sheet
      if (d === "F") d = "Fr";
      if (d === "Thu") d = "Th";
      if (d === "Tue") d = "Tu";

      return d;
    }

    function parseTimeRange(timeStr) {
      // Accepts: "1:20PM - 2:25PM" (spaces optional)
      const raw = String(timeStr || "").trim();
      const parts = raw.split("-").map(s => s.trim());
      if (parts.length !== 2) return null;

      const startPart = parts[0].replace(/\s+/g, "");
      const endPart = parts[1].replace(/\s+/g, "");

      function parseAmPm(s) {
        const m = s.match(/^(\d{1,2}):(\d{2})(AM|PM)$/i);
        if (!m) return null;
        let hh = Number(m[1]);
        const mm = Number(m[2]);
        const ap = m[3].toUpperCase();
        if (ap === "PM" && hh !== 12) hh += 12;
        if (ap === "AM" && hh === 12) hh = 0;
        return { hh, mm };
      }

      const sTime = parseAmPm(startPart);
      const eTime = parseAmPm(endPart);
      if (!sTime || !eTime) return null;
      return { start: sTime, end: eTime };
    }

    async function fetchSheetRowsViaApi() {
      const url =
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(RANGE_A1)}?key=${API_KEY}`;

      const res = await fetch(url);
      const text = await res.text();

      if (!res.ok) {
        throw new Error(`Sheets API request failed (${res.status}).\n${text}`);
      }

      const data = JSON.parse(text);
      const values = data.values || [];
      if (values.length < 2) return [];

      const headers = values[0].map(h => String(h).trim());
      return values.slice(1)
        .filter(row => row.some(cell => String(cell || "").trim() !== ""))
        .map(row => Object.fromEntries(headers.map((h, i) => [h, row[i] ?? ""])));
    }

    function buildEvents(sheetRows) {
      const weekStart = startOfWeekSunday(new Date());
      const events = [];
      const problems = [];

      for (const row of sheetRows) {
        const titleRaw = row[COL_EVENT] ?? "";
        const dayRaw = row[COL_DAY] ?? "";
        const timeRaw = row[COL_TIME] ?? "";
        const location = row[COL_LOCATION] ?? "";

        const title = String(titleRaw).trim() || "Available";
        const dayCode = normalizeDay(dayRaw, title);

        if (!DAY_INDEX.hasOwnProperty(dayCode)) {
          problems.push(`Skipped (bad Day): Event Type="${titleRaw}" Day="${dayRaw}" Time="${timeRaw}"`);
          continue;
        }

        const tr = parseTimeRange(timeRaw);
        if (!tr) {
          problems.push(`Skipped (bad Time): Event Type="${titleRaw}" Day="${dayRaw}" Time="${timeRaw}"`);
          continue;
        }

        const start = new Date(weekStart);
        start.setDate(start.getDate() + DAY_INDEX[dayCode]);
        start.setHours(tr.start.hh, tr.start.mm, 0, 0);

        const end = new Date(weekStart);
        end.setDate(end.getDate() + DAY_INDEX[dayCode]);
        end.setHours(tr.end.hh, tr.end.mm, 0, 0);

        if (end <= start) {
          problems.push(`Skipped (end<=start): Event Type="${titleRaw}" Day="${dayRaw}" Time="${timeRaw}"`);
          continue;
        }

        events.push({
          title,
          start: start.toISOString(),
          end: end.toISOString(),
          extendedProps: { location }
        });
      }

      if (problems.length) {
        console.warn("Some rows were skipped due to formatting issues:\n" + problems.join("\n"));
      }

      return events;
    }

    async function init() {
      if (!API_KEY || API_KEY.includes("YOUR_API_KEY_HERE")) {
        showError("Configuration error: Please set API_KEY to your (restricted) Google Sheets API key.");
        return;
      }

      const rows = await fetchSheetRowsViaApi();
      const events = buildEvents(rows);

      const calendarEl = document.getElementById("calendar");
      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: "timeGridWeek",
        firstDay: 0, // Sunday
        allDaySlot: false,
        nowIndicator: true,
        height: "auto",
        slotMinTime: "07:00:00",
        slotMaxTime: "22:00:00",
        events,
        eventDidMount: function(info) {
          const loc = info.event.extendedProps.location;
          if (loc) info.el.title = loc;
        }
      });

      calendar.render();
    }

    init().catch(err => {
      console.error(err);
      showError(
        "Error loading calendar data.\n\n" +
        (err && err.message ? err.message : String(err)) +
        "\n\nChecklist:\n" +
        "• Is the Google Sheets API enabled for this key?\n" +
        "• Is the key restricted to your GitHub Pages referrer?\n" +
        "• Is the sheet/tab name 'Sheet1' (it is, per your link)?\n" +
        "• Do headers match: Event Type, Day, Time, Location?"
      );
    });
  </script>
</body>
</html>
