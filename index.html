<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CSV Block Calendar</title>

  <!-- FullCalendar (no build step) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

  <!-- PapaParse for CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    #wrap { padding: 12px; }
    #status { font-size: 12px; opacity: 0.75; margin: 6px 0 10px; }
    #calendar { max-width: 1200px; margin: 0 auto; }
  </style>
</head>

<body>
  <div id="wrap">
    <div id="status">Loading…</div>
    <div id="calendar"></div>
  </div>

<script>
/** =========================
 *  CONFIG
 *  ========================= */

/** Your published CSV URL */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQMfXXgtx0YwUqkmvNPdQgzyiilhkiLMW9KZ2NrWsMx_tuj9GqfGLHHHQNuIFKaSCuQ1MxKwpYyAPlQ/pub?gid=0&single=true&output=csv";

/**
 * COLUMN MAPPING
 * Update these to match your CSV header row exactly.
 *
 * Common patterns:
 *  - date + start + end (best)
 *  - start_datetime + end_datetime
 */
const COL = {
  title: "title",            // e.g., "Title", "Event", "Assignment"
  date: "date",              // e.g., "Date" (YYYY-MM-DD)
  start: "start",            // e.g., "Start" (HH:MM or HH:MM AM/PM)
  end: "end",                // e.g., "End"
  startDatetime: "start_datetime", // optional alternative
  endDatetime: "end_datetime",     // optional alternative
  location: "location",      // optional
  category: "category",      // optional (used for coloring if present)
  color: "color"             // optional (hex like #3b82f6)
};

/** Display defaults */
const DEFAULT_VIEW = "timeGridWeek";     // timeGridWeek gives “block schedule” feel
const WEEK_START = 1;                    // 0=Sunday, 1=Monday
const SLOT_MIN_TIME = "07:00:00";
const SLOT_MAX_TIME = "20:00:00";

/** Auto-refresh behavior */
const REFRESH_EVERY_MINUTES = 15;        // periodic refresh
const DAILY_REFRESH_HOUR = 8;            // refresh at 8:00am local time
const DAILY_REFRESH_MINUTE = 0;

/** =========================
 *  IMPLEMENTATION
 *  ========================= */

let calendar;

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

function cacheBustedUrl(url) {
  const u = new URL(url);
  u.searchParams.set("_cb", Date.now().toString());
  return u.toString();
}

function normalizeTime(t) {
  // Accepts "9:00", "09:00", "9:00 AM", etc. Leaves parsing to Date where possible.
  return (t || "").trim();
}

function toISODate(d) {
  return (d || "").trim(); // expect YYYY-MM-DD
}

function buildDateTime(dateStr, timeStr) {
  // Produces "YYYY-MM-DDTHH:MM" (FullCalendar can parse this)
  const d = toISODate(dateStr);
  const t = normalizeTime(timeStr);
  if (!d || !t) return null;

  // If user uses AM/PM, let the Date parser interpret by building a local Date.
  if (/[ap]m/i.test(t)) {
    const dt = new Date(`${d} ${t}`);
    if (isNaN(dt.getTime())) return null;
    return dt.toISOString(); // FullCalendar accepts ISO; will render in local tz by default
  }
  // 24-hour time:
  return `${d}T${t}`;
}

function rowToEvent(row) {
  const title = (row[COL.title] || "").toString().trim() || "Untitled";

  // Two supported schemas:
  // A) date + start + end
  // B) start_datetime + end_datetime
  let start = null;
  let end = null;

  if (row[COL.startDatetime] && row[COL.endDatetime]) {
    start = new Date(row[COL.startDatetime]);
    end = new Date(row[COL.endDatetime]);
    if (isNaN(start.getTime()) || isNaN(end.getTime())) return null;
    start = start.toISOString();
    end = end.toISOString();
  } else {
    start = buildDateTime(row[COL.date], row[COL.start]);
    end = buildDateTime(row[COL.date], row[COL.end]);
    if (!start || !end) return null;
  }

  const location = (row[COL.location] || "").toString().trim();
  const category = (row[COL.category] || "").toString().trim();
  const color = (row[COL.color] || "").toString().trim();

  const evt = {
    title,
    start,
    end
  };

  // Optional display enhancements
  if (location) evt.extendedProps = { location, category };
  if (color) evt.backgroundColor = color, evt.borderColor = color;

  // If no explicit color but category exists, you can add a simple deterministic hash color:
  // (left out to avoid “mystery colors”; add if you want.)
  return evt;
}

async function fetchEventsFromCsv() {
  setStatus("Fetching CSV…");

  const resp = await fetch(cacheBustedUrl(CSV_URL), { cache: "no-store" });
  if (!resp.ok) throw new Error(`CSV fetch failed: ${resp.status} ${resp.statusText}`);
  const csvText = await resp.text();

  const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
  if (parsed.errors?.length) {
    // non-fatal parse errors may exist; still try
    console.warn(parsed.errors);
  }

  const rows = parsed.data || [];
  const events = rows.map(rowToEvent).filter(Boolean);

  setStatus(`Loaded ${events.length} events. Last updated: ${new Date().toLocaleString()}`);
  return events;
}

async function refreshCalendar() {
  try {
    const events = await fetchEventsFromCsv();
    calendar.removeAllEvents();
    calendar.addEventSource(events);
  } catch (e) {
    console.error(e);
    setStatus(`Error: ${e.message}`);
  }
}

function scheduleDailyRefreshAt(hour, minute) {
  function msUntilNextTrigger() {
    const now = new Date();
    const next = new Date(now);
    next.setHours(hour, minute, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1);
    return next - now;
  }
  setTimeout(async function run() {
    await refreshCalendar();
    setTimeout(run, 24 * 60 * 60 * 1000); // repeat daily
  }, msUntilNextTrigger());
}

document.addEventListener("DOMContentLoaded", async () => {
  const el = document.getElementById("calendar");
  calendar = new FullCalendar.Calendar(el, {
    initialView: DEFAULT_VIEW,
    firstDay: WEEK_START,
    nowIndicator: true,
    height: "auto",
    slotMinTime: SLOT_MIN_TIME,
    slotMaxTime: SLOT_MAX_TIME,
    allDaySlot: false,
    expandRows: true,
    eventTimeFormat: { hour: "numeric", minute: "2-digit" },
    headerToolbar: {
      left: "prev,next today",
      center: "title",
      right: "timeGridDay,timeGridWeek,dayGridMonth"
    },
    eventDidMount: function(info) {
      // Show location in tooltip if present
      const loc = info.event.extendedProps?.location;
      if (loc) info.el.title = loc;
    }
  });

  calendar.render();
  await refreshCalendar();

  // Periodic refresh
  if (REFRESH_EVERY_MINUTES > 0) {
    setInterval(refreshCalendar, REFRESH_EVERY_MINUTES * 60 * 1000);
  }

  // Daily refresh at 8:00am local time
  scheduleDailyRefreshAt(DAILY_REFRESH_HOUR, DAILY_REFRESH_MINUTE);
});
</script>
</body>
</html>
